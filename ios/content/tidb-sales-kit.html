<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TiDB Compass</title>
    <style>
      :root {
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 32px;
        --radius-sm: 12px;
        --radius-md: 18px;
        --radius-lg: 24px;
        --radius-xl: 28px;
        --bg: #fcf8fb;
        --surface: #fcf8fb;
        --surface-low: #f6f3f5;
        --surface-card: #ffffff;
        --surface-high: #eae7ea;
        --ink: #1b1b1d;
        --muted: #5e5e60;
        --primary: #bc000a;
        --primary-strong: #e2241f;
        --primary-soft: rgba(188, 0, 10, 0.08);
        --tertiary: #00647f;
        --tertiary-soft: rgba(0, 100, 127, 0.12);
        --outline: rgba(231, 189, 183, 0.28);
        --shadow: 0 8px 32px rgba(27, 27, 29, 0.06);
        --shadow-soft: 0 6px 24px rgba(27, 27, 29, 0.04);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: "Inter", "SF Pro Display", "PingFang SC", "Hiragino Sans",
          "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(226, 36, 31, 0.08), transparent 30%),
          linear-gradient(180deg, var(--surface) 0%, #f8f5f8 100%);
      }

      button {
        font: inherit;
      }

      img {
        display: block;
        width: 100%;
      }

      .app {
        min-height: 100dvh;
        padding-top: env(safe-area-inset-top, 0);
        padding-bottom: calc(env(safe-area-inset-bottom, 0) + 64px);
      }

      .app-shell {
        padding: 20px 18px 0;
      }

      .screen {
        display: none;
      }

      .screen.is-active {
        display: block;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .page-header {
        margin-bottom: 22px;
      }

      .page-header h1,
      .page-header h2,
      .card h3,
      .leaf h3,
      .cta-panel h2 {
        margin: 0;
        letter-spacing: -0.03em;
      }

      .page-header h1 {
        font-size: clamp(2.8rem, 8vw, 3.5rem);
        line-height: 0.95;
      }

      .page-header h2 {
        font-size: clamp(2rem, 6vw, 2.4rem);
        line-height: 0.98;
      }

      .page-header p,
      .card p,
      .subtle,
      .cta-panel p,
      .list-row p,
      .metric-card p,
      .table-card td,
      .table-card th {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .hero-actions,
      .pill-row,
      .tag-row,
      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button,
      .button-secondary,
      .tag,
      .nav-pill {
        border: 0;
        border-radius: 999px;
      }

      .button:focus-visible,
      .button-secondary:focus-visible,
      .tab-button:focus-visible {
        outline: 2px solid rgba(0, 100, 127, 0.42);
        outline-offset: 2px;
      }

      .button {
        padding: 12px 18px;
        color: #fff;
        font-weight: 700;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
        box-shadow: var(--shadow-soft);
      }

      .button-secondary {
        padding: 12px 18px;
        color: var(--ink);
        font-weight: 700;
        background: var(--surface-high);
      }

      .tag {
        padding: 6px 10px;
        color: var(--primary);
        background: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .surface {
        background: var(--surface-low);
        border-radius: 28px;
      }

      .card {
        padding: 18px;
        background: var(--surface-card);
        border-radius: 24px;
        box-shadow: var(--shadow-soft);
      }

      .glass {
        background: rgba(252, 248, 251, 0.8);
        backdrop-filter: blur(20px);
      }

      .section-frame {
        padding: 18px;
        border-radius: var(--radius-xl);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(246, 243, 245, 0.94)),
          var(--surface-low);
        box-shadow: var(--shadow-soft);
      }

      .summary-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .summary-card {
        min-height: 92px;
        padding: 14px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow-soft);
      }

      .summary-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .summary-value {
        margin: 0;
        font-size: 1.7rem;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .summary-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .stage-banner {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
        padding: 16px 18px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(188, 0, 10, 0.08), rgba(188, 0, 10, 0.02));
      }

      .stage-banner h3,
      .stage-banner p {
        margin: 0;
      }

      .stage-banner h3 {
        font-size: 1.05rem;
      }

      .stage-banner p {
        color: var(--muted);
        line-height: 1.55;
      }

      .hero-grid,
      .grid-two,
      .grid-three,
      .stack {
        display: grid;
        gap: 14px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .grid-two {
        grid-template-columns: 1fr;
      }

      .grid-three {
        grid-template-columns: 1fr;
      }

      .intro-hero {
        position: relative;
        overflow: hidden;
        min-height: 280px;
        padding: 22px;
        background: var(--surface-card);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      .intro-hero::after {
        content: "";
        position: absolute;
        inset: auto -10% -20% 24%;
        height: 56%;
        background:
          linear-gradient(135deg, rgba(188, 0, 10, 0.16), transparent 48%),
          radial-gradient(circle at top left, rgba(226, 36, 31, 0.15), transparent 42%);
        filter: blur(8px);
        pointer-events: none;
      }

      .hero-visual {
        margin-top: 18px;
        min-height: 170px;
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(246, 243, 245, 0.92)),
          radial-gradient(circle at top right, rgba(188, 0, 10, 0.1), transparent 35%);
        overflow: hidden;
        position: relative;
      }

      .hero-visual::before,
      .hero-visual::after {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 18px;
        background:
          linear-gradient(135deg, rgba(188, 0, 10, 0.08), transparent 44%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(244, 239, 243, 0.7));
      }

      .hero-visual::after {
        inset: auto 24px 20px 24px;
        height: 44%;
        background:
          linear-gradient(90deg, rgba(188, 0, 10, 0.24), transparent 55%),
          repeating-linear-gradient(
            90deg,
            rgba(188, 0, 10, 0.08) 0 1px,
            transparent 1px 42px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 100, 127, 0.06) 0 1px,
            transparent 1px 28px
          );
      }

      .metric-leaf {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 18px;
        min-height: 220px;
        padding: 22px;
        color: #fff;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
        border-radius: 24px 8px 24px 8px;
        box-shadow: 0 16px 36px rgba(188, 0, 10, 0.22);
      }

      .metric-leaf .value {
        font-size: clamp(2.75rem, 8vw, 3.5rem);
        font-weight: 800;
        line-height: 0.9;
      }

      .metric-leaf .caption,
      .metric-leaf .subtle {
        color: rgba(255, 255, 255, 0.8);
      }

      .icon-wrap {
        display: inline-grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 18px;
        font-weight: 700;
      }

      .icon-wrap.tertiary {
        background: var(--tertiary-soft);
        color: var(--tertiary);
      }

      .feature-card,
      .tool-card,
      .list-row,
      .stat-card,
      .table-card,
      .cta-panel,
      .ai-panel,
      .dark-card {
        border-radius: 24px;
      }

      .feature-card {
        padding: 18px;
        background: var(--surface-low);
      }

      .hero-feature {
        position: relative;
        overflow: hidden;
        min-height: 280px;
        padding: 22px;
        background: var(--surface-card);
        box-shadow: var(--shadow-soft);
      }

      .hero-feature::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, transparent 40%, rgba(252, 248, 251, 0.92) 100%),
          radial-gradient(circle at top right, rgba(188, 0, 10, 0.08), transparent 30%);
        pointer-events: none;
      }

      .hero-feature .content {
        position: relative;
        z-index: 1;
        max-width: 74%;
      }

      .hero-image,
      .compare-image,
      .ai-image {
        overflow: hidden;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(27, 27, 29, 0.06), rgba(27, 27, 29, 0.01));
      }

      .preview-pane {
        min-height: 240px;
        padding: 16px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(246, 243, 245, 0.92)),
          radial-gradient(circle at top right, rgba(188, 0, 10, 0.1), transparent 34%);
      }

      .preview-pane.compare {
        min-height: 220px;
      }

      .preview-pane.ai {
        min-height: 250px;
        background:
          linear-gradient(180deg, rgba(0, 100, 127, 0.12), rgba(255, 255, 255, 0.92)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(246, 243, 245, 0.92));
      }

      .preview-device {
        display: grid;
        gap: 10px;
        height: 100%;
        padding: 14px;
        border-radius: 24px;
        background: linear-gradient(180deg, #17171a 0%, #252529 100%);
        box-shadow: 0 16px 30px rgba(27, 27, 29, 0.12);
      }

      .preview-island {
        width: 74px;
        height: 18px;
        margin: 0 auto;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }

      .preview-screen {
        display: grid;
        gap: 10px;
        min-height: 150px;
        padding: 14px;
        border-radius: 20px;
        background:
          radial-gradient(circle at top right, rgba(226, 36, 31, 0.12), transparent 24%),
          linear-gradient(180deg, #fcf8fb 0%, #f5f1f4 100%);
      }

      .preview-row,
      .preview-bars,
      .preview-mini-grid {
        display: grid;
        gap: 8px;
      }

      .preview-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .preview-bars {
        grid-template-columns: 1.1fr 0.9fr;
      }

      .preview-mini-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .preview-chip,
      .preview-block,
      .preview-stat,
      .preview-pill {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.78);
      }

      .preview-chip {
        height: 24px;
      }

      .preview-pill {
        height: 18px;
        width: 46%;
        background: rgba(188, 0, 10, 0.12);
      }

      .preview-block {
        min-height: 62px;
        padding: 12px;
      }

      .preview-stat {
        min-height: 76px;
        padding: 12px;
      }

      .preview-line {
        height: 8px;
        border-radius: 999px;
        background: rgba(188, 0, 10, 0.14);
      }

      .preview-line.short {
        width: 56%;
      }

      .preview-line.mid {
        width: 72%;
      }

      .preview-grid-panel {
        display: grid;
        gap: 10px;
        grid-template-columns: 1.2fr 0.8fr;
      }

      .preview-table {
        display: grid;
        gap: 8px;
      }

      .preview-table-row {
        display: grid;
        gap: 8px;
        grid-template-columns: 0.9fr 1fr 1fr;
      }

      .preview-cell {
        min-height: 42px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
      }

      .preview-cell.highlight {
        background: rgba(188, 0, 10, 0.14);
      }

      .preview-ai-rail {
        display: grid;
        gap: 10px;
        grid-template-columns: 0.95fr 1.05fr;
      }

      .preview-glow {
        min-height: 110px;
        border-radius: 18px;
        background:
          radial-gradient(circle at 30% 30%, rgba(0, 100, 127, 0.26), transparent 28%),
          radial-gradient(circle at 72% 64%, rgba(188, 0, 10, 0.18), transparent 26%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(242, 247, 249, 0.9));
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list-row {
        display: grid;
        gap: 8px;
        padding: 16px 18px;
        background: var(--surface-card);
        box-shadow: var(--shadow-soft);
      }

      .list-row-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge.primary {
        color: var(--primary);
        background: rgba(188, 0, 10, 0.1);
      }

      .badge.tertiary {
        color: var(--tertiary);
        background: rgba(0, 100, 127, 0.1);
      }

      .badge.soft {
        color: var(--muted);
        background: rgba(228, 226, 228, 0.72);
      }

      .stats-inline {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .stat-card {
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.62);
      }

      .stat-card strong {
        display: block;
        margin-bottom: 6px;
        color: var(--primary);
        font-size: 1.6rem;
        line-height: 1;
      }

      .sub-grid {
        display: grid;
        gap: 12px;
      }

      .dark-card {
        position: relative;
        overflow: hidden;
        padding: 22px;
        color: #fff;
        background: linear-gradient(180deg, #252527 0%, #1b1b1d 100%);
      }

      .dark-card p,
      .dark-card .subtle {
        color: rgba(255, 255, 255, 0.78);
      }

      .dark-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .dark-stat {
        padding: 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
      }

      .table-card {
        padding: 8px;
        background: var(--surface-low);
      }

      .table-scroll {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 560px;
        border-collapse: separate;
        border-spacing: 0;
      }

      th,
      td {
        padding: 16px 14px;
        vertical-align: top;
        text-align: left;
      }

      thead th {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      tbody tr {
        background: var(--surface-card);
      }

      tbody tr + tr td {
        border-top: 12px solid var(--surface-low);
      }

      tbody td:first-child,
      thead th:first-child {
        border-top-left-radius: 18px;
        border-bottom-left-radius: 18px;
      }

      tbody td:last-child,
      thead th:last-child {
        border-top-right-radius: 18px;
        border-bottom-right-radius: 18px;
      }

      .good {
        color: var(--primary);
        font-weight: 700;
      }

      .neutral {
        color: var(--tertiary);
        font-weight: 700;
      }

      .cta-panel {
        padding: 24px 22px;
        background: var(--surface-low);
      }

      .ai-panel {
        padding: 22px;
        background: linear-gradient(180deg, #007fa0 0%, #005770 100%);
        color: #fff;
      }

      .ai-panel p {
        color: rgba(255, 255, 255, 0.8);
      }

      .chip-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.92);
        font-size: 11px;
        font-weight: 700;
      }

      .tabbar-wrap {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 4px 10px calc(env(safe-area-inset-bottom, 0) + 4px);
        background: linear-gradient(180deg, rgba(252, 248, 251, 0), rgba(252, 248, 251, 0.94) 28%);
      }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
        padding: 6px;
        border-radius: 20px;
        background: rgba(252, 248, 251, 0.76);
        box-shadow: 0 -2px 18px rgba(0, 0, 0, 0.035);
      }

      .tab-button {
        display: grid;
        gap: 4px;
        justify-items: center;
        padding: 6px 3px 7px;
        border: 0;
        border-radius: 15px;
        color: var(--muted);
        background: transparent;
      }

      .tab-button .icon {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 9px;
        background: rgba(228, 226, 228, 0.8);
        font-size: 12px;
        font-weight: 800;
      }

      .tab-button strong {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .tab-button.is-active {
        color: var(--primary);
      }

      .tab-button.is-active .icon {
        background: rgba(188, 0, 10, 0.1);
      }

      @media (min-width: 768px) {
        .app-shell {
          padding: 24px 24px 0;
        }

        .grid-two {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-three {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .hero-grid {
          grid-template-columns: 1.2fr 0.8fr;
        }
      }

      .app[data-orientation="landscape"] {
        padding-bottom: env(safe-area-inset-bottom, 0);
      }

      .app[data-orientation="landscape"] .tabbar-wrap {
        display: none;
      }

      .app[data-orientation="landscape"] .app-shell {
        padding-bottom: 24px;
      }

      .app[data-orientation="landscape"] .grid-two,
      .app[data-orientation="landscape"] .hero-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .app[data-orientation="landscape"] .summary-strip {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      @media (max-width: 430px) and (orientation: portrait) {
        .app-shell {
          padding: 16px 14px 0;
        }

        .page-header {
          margin-bottom: 18px;
        }

        .page-header h1 {
          font-size: 2.7rem;
        }

        .page-header h2 {
          font-size: 1.85rem;
        }

        .hero-feature .content {
          max-width: 100%;
        }

        .card,
        .feature-card,
        .hero-feature,
        .metric-leaf,
        .dark-card,
        .cta-panel,
        .ai-panel {
          padding: 16px;
          border-radius: 20px;
        }

        .tabbar {
          gap: 3px;
          padding: 5px;
        }

        .tab-button strong {
          font-size: 8px;
        }

        .summary-strip {
          grid-template-columns: 1fr;
        }

        .summary-card {
          min-height: auto;
        }

        .preview-pane,
        .preview-pane.compare,
        .preview-pane.ai {
          min-height: 196px;
        }

        .preview-device {
          padding: 12px;
          border-radius: 22px;
        }

        .preview-screen {
          min-height: 128px;
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const injectedContext = window.__TIDB_COMPASS_CONTEXT__ || {};
      const locale = params.get("lang") || injectedContext.lang || "zh-CN";
      const orientation = params.get("orientation") || injectedContext.orientation || "portrait";
      const device = params.get("device") || injectedContext.device || "iphone";

      const messages = {
        "zh-CN": {
          appName: "TiDB Compass",
          reviewer: "Digital Curator Mode",
          ui: {
            scenarioMapping: "场景映射",
            competitiveRanking: "竞争定位",
            fit: "适配",
            storyBannerTitle: "设计模式",
