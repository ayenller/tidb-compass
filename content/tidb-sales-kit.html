<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

      name="viewport"

    <style>
      :root {
        --bg: #f7fbff;
        --card: rgba(255, 255, 255, 0.96);
        --ink: #12253f;
        --muted: #627188;
        --line: rgba(18, 37, 63, 0.1);
        --accent: #0d8a67;
        --accent-strong: #0a6e52;
        --accent-soft: rgba(13, 138, 103, 0.12);
        --alt-soft: rgba(88, 122, 255, 0.1);
        --shadow: 0 20px 40px rgba(18, 37, 63, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(circle at top, rgba(13, 138, 103, 0.08), transparent 24%),
          linear-gradient(180deg, #f7fbff 0%, #fbfdff 100%);
      }

      .page {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 20px 16px 36px;
      }

      .hero,
      .section,
      .card,
      .story,
      .compare-table,
      .faq-item {
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(13, 138, 103, 0.12) 0%, rgba(255, 255, 255, 0.98) 54%),
          var(--card);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 14px;
        font-size: clamp(30px, 8vw, 48px);
        line-height: 1.04;
      }

      h2 {
        margin-bottom: 10px;
        font-size: 28px;
      }

      .hero-copy,
      .section-head p,
      .card p,
      .story p,
      .faq-item p,
      .note {
        color: var(--muted);
        line-height: 1.7;
      }

      .hero-grid,
      .story-grid,
      .compare-layout,
      .faq-grid,
      .next-grid,
      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .hero-panel {
        padding: 18px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        padding: 14px;
        border-radius: 18px;
        background: #f5f9ff;
      }

      .stat strong {
        display: block;
        margin-bottom: 6px;
        font-size: 24px;
      }

      .section {
        margin-top: 18px;
        padding: 22px;
      }

      .section-head {
        margin-bottom: 18px;
      }

      .chip-row,
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip,
      .tag {
        border-radius: 999px;
      }

      .chip {
        padding: 10px 14px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: #fff;
        cursor: pointer;
      }

      .chip.is-active {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      }

      .tag {
        padding: 6px 10px;
        font-size: 12px;
        color: var(--accent);
        background: var(--accent-soft);
      }

      .card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .card,
      .story,
      .faq-item {
        padding: 20px;
      }

      .story.highlight {
        background: linear-gradient(135deg, #0f2b4a 0%, #173c66 100%);
      }

      .story.highlight h3,
      .story.highlight p,
      .story.highlight li {
        color: #fff;
      }

      .bullet-list {
        margin: 0;
        padding-left: 18px;
        line-height: 1.7;
      }

      .compare-table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
      }

      .compare-table th,
      .compare-table td {
        padding: 14px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }

      .compare-table th {
        background: #f5f9ff;
      }

      .good {
        color: var(--accent);
        font-weight: 700;
      }

      .warning {
        color: #a77411;
        font-weight: 700;
      }

      .risk {
        color: #a54322;
        font-weight: 700;
      }

      .note {
        padding: 16px 18px;
        border-radius: 18px;
        background: var(--alt-soft);
      }

      .empty-state {
        display: none;
        margin-top: 14px;
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 18px;
        color: var(--muted);
        background: #f7fbff;
      }

      .filtered-out {
        display: none;
      }

      @media (max-width: 900px) {
        .hero-grid,
        .story-grid,
        .compare-layout,
        .faq-grid,
        .next-grid,
        .card-grid {
          grid-template-columns: 1fr;
        }

        .stat-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

          <p class="hero-copy">${content.subtitle}</p>
          <div class="hero-grid">
            <div class="hero-panel">
              <h3>${content.pitchTitle}</h3>
              <p class="hero-copy">${content.pitchBody}</p>
              <div class="tag-list">
                <span class="tag">Distributed SQL</span>
                <span class="tag">HTAP</span>
                <span class="tag">MySQL</span>
                <span class="tag">iOS-ready</span>
              </div>
            </div>
            <div class="hero-panel">
              <h3>${content.valueTitle}</h3>
              <div class="stat-row">
                ${content.stats
                  .map(
                    (stat) => `
                      <div class="stat">
                        <strong>${stat[0]}</strong>
                        <span>${stat[1]}</span>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <p class="eyebrow">Filters</p>
            <h2>${content.filterTitle}</h2>
            <p>${content.filterBody}</p>
          </div>
          <div class="chip-row" id="filters">
            ${topicKeys
              .map(
                (key, index) =>
                  `<button class="chip ${index === 0 ? "is-active" : ""}" type="button" data-filter="${key}">${labels[key]}</button>`
              )
              .join("")}
          </div>
          <div class="empty-state" id="empty-state">${content.empty}</div>
        </section>

        <section class="section" data-topics="all scaling realtime ha mysql cost global">
          <div class="section-head">
            <p class="eyebrow">${content.sections.overview.eyebrow}</p>
            <h2>${content.sections.overview.title}</h2>
            <p>${content.sections.overview.body}</p>
          </div>
          <div class="card-grid">
            ${content.sections.overview.cards.map(renderCard).join("")}
          </div>
        </section>

        <section class="section" data-topics="all scaling realtime ha mysql cost">
          <div class="section-head">
            <p class="eyebrow">${content.sections.capabilities.eyebrow}</p>
            <h2>${content.sections.capabilities.title}</h2>
            <p>${content.sections.capabilities.body}</p>
          </div>
          <div class="card-grid">
            ${content.sections.capabilities.cards.map(renderCard).join("")}
          </div>
        </section>

        <section class="section" data-topics="all realtime scaling cost global">
          <div class="section-head">
            <p class="eyebrow">${content.sections.scenarios.eyebrow}</p>
            <h2>${content.sections.scenarios.title}</h2>
            <p>${content.sections.scenarios.body}</p>
          </div>
          <div class="story-grid">
            ${content.sections.scenarios.stories.map(renderStory).join("")}
          </div>
        </section>

        <section class="section" data-topics="all scaling realtime ha mysql cost">
          <div class="section-head">
            <p class="eyebrow">${content.sections.compare.eyebrow}</p>
            <h2>${content.sections.compare.title}</h2>
            <p>${content.sections.compare.body}</p>
          </div>
          <div class="compare-layout">
            <table class="compare-table">
              <thead>
                <tr>
                  ${content.sections.compare.headers.map((header) => `<th>${header}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${content.sections.compare.rows
                  .map(
                    (row) => `
                      <tr data-topics="${row[4]}">
                        <td>${row[0]}</td>
                        <td class="${row[1][1]}">${row[1][0]}</td>
                        <td class="${row[2][1]}">${row[2][0]}</td>
                        <td class="${row[3][1]}">${row[3][0]}</td>
                      </tr>
                    `
                  )
                  .join("")}
              </tbody>
            </table>
            <article class="story">
              <h3>${content.sections.compare.sideTitle}</h3>
              <ul class="bullet-list">
                ${content.sections.compare.sideBullets.map((item) => `<li>${item}</li>`).join("")}
              </ul>
            </article>
          </div>
        </section>

        <section class="section" data-topics="all ha mysql cost realtime">
          <div class="section-head">
            <p class="eyebrow">${content.sections.faq.eyebrow}</p>
            <h2>${content.sections.faq.title}</h2>
            <p>${content.sections.faq.body}</p>
          </div>
          <div class="faq-grid">
            ${content.sections.faq.items
              .map(
                (item) => `
                  <article class="faq-item" data-topics="${item[2]}">
                    <h3>${item[0]}</h3>
                    <p>${item[1]}</p>
                  </article>
                `
              )
              .join("")}
          </div>
        </section>

        <section class="section" data-topics="all">
          <div class="section-head">
            <p class="eyebrow">${content.sections.next.eyebrow}</p>
            <h2>${content.sections.next.title}</h2>
            <p>${content.sections.next.body}</p>
          </div>
          <div class="next-grid">
            ${content.sections.next.cards
              .map(
                (item) => `
                  <article class="card">
                    <h3>${item[0]}</h3>
                    <p>${item[1]}</p>
                  </article>
                `
              )
              .join("")}
          </div>
          <div class="note">${content.sections.next.note}</div>
        </section>
      `;

      const chips = Array.from(document.querySelectorAll(".chip"));
      const filterables = Array.from(document.querySelectorAll("[data-topics]"));
      const emptyState = document.querySelector("#empty-state");

      function matchesTopic(element, topic) {
        const topics = (element.dataset.topics || "").split(/\s+/).filter(Boolean);
        return topic === "all" || topics.includes("all") || topics.includes(topic);
      }

      function applyFilter(topic) {
        let visibleCount = 0;
        filterables.forEach((element) => {
          const visible = matchesTopic(element, topic);
          element.classList.toggle("filtered-out", !visible);
          if (visible) {
            visibleCount += 1;
          }
        });
        emptyState.style.display = visibleCount > 1 ? "none" : "block";
      }

      document.querySelector("#filters").addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) {
          return;
        }

        chips.forEach((chip) => chip.classList.remove("is-active"));
        button.classList.add("is-active");
        applyFilter(button.dataset.filter || "all");
      });
    </script>
  </body>
</html>
