<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TiDB Compass App Preview</title>
    <style>
      :root {
        --bg: #f4f8fd;
        --surface: rgba(255, 255, 255, 0.86);
        --surface-strong: #ffffff;
        --ink: #10233e;
        --muted: #627188;
        --line: rgba(16, 35, 62, 0.08);
        --accent: #0d8a67;
        --accent-strong: #0a6e52;
        --accent-soft: rgba(13, 138, 103, 0.12);
        --blue-soft: rgba(93, 127, 255, 0.1);
        --shadow: 0 18px 40px rgba(29, 56, 88, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(13, 138, 103, 0.12), transparent 28%),
          linear-gradient(180deg, #f4f8fd 0%, #fbfcff 100%);
      }

      button {
        font: inherit;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        padding-top: env(safe-area-inset-top, 0);
        padding-bottom: calc(env(safe-area-inset-bottom, 0) + 94px);
      }

      .app-shell {
        flex: 1;
        padding: 18px 18px 0;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .status-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .title-group p,
      .section-header p,
      .card p,
      .hero-subtitle,
      .detail p,
      .faq-item p,
      .compare-card p {
        margin-top: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .kicker {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 6px;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.05;
      }

      h2 {
        margin-bottom: 8px;
        font-size: clamp(24px, 3vw, 32px);
      }

      .avatar {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent) 0%, #1a986d 100%);
      }

      .screen {
        display: none;
      }

      .screen.is-active {
        display: block;
        animation: fadeSlideUp 280ms ease;
      }

      .hero,
      .panel,
      .card,
      .compare-card,
      .faq-item,
      .tabbar {
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 22px;
        background:
          linear-gradient(135deg, rgba(13, 138, 103, 0.12) 0%, rgba(255, 255, 255, 0.98) 55%),
          var(--surface-strong);
      }

      .brand-ribbon {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand-markline {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .brand-chip {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent) 0%, #1a986d 100%);
      }

      .projection-badge {
        padding: 9px 12px;
        border-radius: 999px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--line);
      }

      .hero-grid,
      .metrics,
      .grid,
      .scenario-grid,
      .compare-grid,
      .faq-grid,
      .detail-grid,
      .signal-grid,
      .journey-grid,
      .summary-stack,
      .capability-layout,
      .stage-rail {
        display: grid;
        gap: 14px;
      }

      .hero-grid {
        grid-template-columns: 1.3fr 1fr;
        margin-top: 18px;
      }

      .hero-visual {
        position: relative;
        overflow: hidden;
        min-height: 248px;
        padding: 18px;
        border-radius: 24px;
        background:
          radial-gradient(circle at top right, rgba(93, 127, 255, 0.26), transparent 36%),
          linear-gradient(180deg, #13365d 0%, #0f2743 100%);
        color: #fff;
      }

      .hero-visual::after {
        content: "";
        position: absolute;
        right: -36px;
        bottom: -48px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(13, 138, 103, 0.28), transparent 68%);
      }

      .mini-kicker {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.68);
      }

      .hero-visual h3,
      .hero-visual p {
        position: relative;
        z-index: 1;
      }

      .hero-visual p {
        color: rgba(255, 255, 255, 0.78);
      }

      .signal-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 18px;
      }

      .signal-card {
        position: relative;
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .signal-card strong {
        display: block;
        margin-bottom: 20px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.82);
      }

      .signal-bars {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 92px;
      }

      .signal-bars span {
        width: 100%;
        border-radius: 12px 12px 4px 4px;
        background: linear-gradient(180deg, rgba(114, 180, 255, 0.92) 0%, rgba(13, 138, 103, 0.9) 100%);
      }

      .panel,
      .card,
      .compare-card,
      .faq-item {
        padding: 18px;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .card:hover,
      .compare-card:hover,
      .faq-item:hover,
      .journey-card:hover,
      .projection-tile:hover,
      .stage-tile:hover {
        transform: translateY(-2px);
        border-color: rgba(13, 138, 103, 0.16);
        box-shadow: 0 22px 42px rgba(29, 56, 88, 0.12);
      }

      .metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .projection-strip {
        display: grid;
        grid-template-columns: 1.4fr 0.6fr 0.7fr;
        gap: 12px;
        margin-top: 16px;
      }

      .projection-tile {
        padding: 14px 16px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.82);
      }

      .projection-tile strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }

      .metric {
        padding: 14px;
        border-radius: 20px;
        background: #f6f9ff;
      }

      .metric strong {
        display: block;
        margin-bottom: 6px;
        font-size: 24px;
      }

      .chip-row,
      .tag-row,
      .segmented {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip,
      .tag,
      .segment-button,
      .tab-button {
        border-radius: 999px;
      }

      .chip,
      .segment-button {
        padding: 10px 14px;
        border: 1px solid var(--line);
        color: var(--ink);
        background: #fff;
        cursor: pointer;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
      }

      .chip.is-active,
      .segment-button.is-active {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      }

      .tag {
        padding: 6px 10px;
        font-size: 12px;
        color: var(--accent);
        background: var(--accent-soft);
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 16px;
      }

      .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .card-glyph {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 14px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
        background: var(--accent-soft);
      }

      .capability-layout {
        grid-template-columns: 1.1fr 0.9fr;
        margin-top: 18px;
      }

      .spotlight-card {
        padding: 20px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(13, 138, 103, 0.12) 0%, rgba(255, 255, 255, 0.96) 68%),
          var(--surface-strong);
        box-shadow: var(--shadow);
      }

      .spotlight-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .spotlight-stat {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--line);
      }

      .spotlight-stat strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }

      .journey-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 16px;
      }

      .journey-card {
        padding: 16px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.84);
      }

      .journey-card strong {
        display: inline-grid;
        width: 32px;
        height: 32px;
        place-items: center;
        margin-bottom: 12px;
        border-radius: 12px;
        color: var(--accent);
        background: var(--accent-soft);
      }

      .card h3,
      .compare-card h3,
      .faq-item h3 {
        margin-bottom: 8px;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .cta {
        padding: 12px 16px;
        border: 0;
        border-radius: 16px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
      }

      .cta.secondary {
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
      }

      .cta:hover,
      .cta.secondary:hover,
      .chip:hover,
      .segment-button:hover,
      .tab-button:hover {
        transform: translateY(-1px);
      }

      .section {
        margin-top: 18px;
      }

      .section-header {
        margin-bottom: 14px;
      }

      .scenario-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card.featured,
      .compare-card.featured {
        background:
          linear-gradient(135deg, rgba(93, 127, 255, 0.1) 0%, rgba(255, 255, 255, 0.96) 70%),
          var(--surface-strong);
      }

      .compare-grid {
        grid-template-columns: 1.15fr 0.85fr;
      }

      .compare-main {
        display: grid;
        gap: 14px;
      }

      .compare-headline {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .projection-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .projection-stat {
        padding: 16px;
        border-radius: 20px;
        color: #fff;
        background: linear-gradient(135deg, #173d67 0%, #0f2844 100%);
      }

      .projection-stat strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
      }

      .projection-stat span {
        font-size: 26px;
        font-weight: 800;
        line-height: 1;
      }

      .compare-badge {
        padding: 8px 12px;
        border-radius: 999px;
        color: var(--accent);
        background: var(--accent-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .summary-stack {
        grid-template-columns: 1fr;
      }

      .summary-tile {
        padding: 14px 16px;
        border-radius: 18px;
        background: #f6f9ff;
        border: 1px solid var(--line);
      }

      .stage-rail {
        margin-top: 18px;
      }

      .stage-tile {
        display: grid;
        gap: 8px;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.86);
      }

      .stage-tile strong {
        color: var(--ink);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 10px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }

      th {
        color: var(--muted);
        font-weight: 700;
      }

      .good {
        color: var(--accent);
        font-weight: 700;
      }

      .warning {
        color: #9f7418;
        font-weight: 700;
      }

      .risk {
        color: #ac4a2c;
        font-weight: 700;
      }

      .faq-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .tabbar-wrap {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding:
          10px 14px
          calc(env(safe-area-inset-bottom, 0) + 10px);
        background: linear-gradient(180deg, rgba(244, 248, 253, 0) 0%, rgba(244, 248, 253, 0.92) 26%, rgba(244, 248, 253, 1) 100%);
      }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        padding: 10px;
        gap: 8px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
      }

      .tab-button {
        display: grid;
        gap: 5px;
        justify-items: center;
        border: 0;
        padding: 10px 6px 12px;
        cursor: pointer;
        color: var(--muted);
        background: transparent;
        border-radius: 20px;
        transition: transform 160ms ease, background 160ms ease, color 160ms ease;
      }

      .tab-button strong {
        font-size: 11px;
      }

      .tab-button .icon {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 12px;
        background: rgba(98, 113, 136, 0.12);
        font-size: 14px;
        font-weight: 700;
      }

      .tab-button.is-active {
        color: var(--accent);
        background: rgba(13, 138, 103, 0.08);
      }

      .tab-button.is-active .icon {
        background: var(--accent-soft);
      }

      .two-line {
        display: grid;
        gap: 6px;
      }

      .device-note {
        margin-top: 16px;
        padding: 16px;
        border-radius: 20px;
        background: var(--blue-soft);
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        .screen.is-active {
          animation: none;
        }

        .card,
        .compare-card,
        .faq-item,
        .journey-card,
        .projection-tile,
        .stage-tile,
        .cta,
        .chip,
        .segment-button,
        .tab-button {
          transition: none;
        }

        .card:hover,
        .compare-card:hover,
        .faq-item:hover,
        .journey-card:hover,
        .projection-tile:hover,
        .stage-tile:hover,
        .cta:hover,
        .cta.secondary:hover,
        .chip:hover,
        .segment-button:hover,
        .tab-button:hover {
          transform: none;
        }
      }

      @media (max-width: 767px) {
        .hero-grid,
        .metrics,
        .grid,
        .scenario-grid,
        .compare-grid,
        .faq-grid,
        .detail-grid,
        .journey-grid,
        .signal-grid,
        .capability-layout,
        .spotlight-stats,
        .projection-strip,
        .projection-panel {
          grid-template-columns: 1fr;
        }

        .tab-button strong {
          font-size: 10px;
        }
      }

      @media (max-width: 430px) and (orientation: portrait) {
        .app {
          padding-bottom: calc(env(safe-area-inset-bottom, 0) + 86px);
        }

        .app-shell {
          padding: 12px 12px 0;
        }

        .status-row {
          margin-bottom: 10px;
          font-size: 11px;
        }

        .topbar {
          margin-bottom: 12px;
        }

        .topbar .avatar,
        .hero-visual,
        .projection-strip,
        .device-note {
          display: none;
        }

        .hero {
          padding: 16px;
          border-radius: 24px;
        }

        h1 {
          margin-bottom: 4px;
          font-size: 24px;
          line-height: 1.08;
        }

        h2 {
          font-size: 21px;
        }

        .hero-subtitle,
        .section-header p,
        .card p,
        .faq-item p,
        .compare-card p {
          line-height: 1.55;
        }

        .brand-ribbon {
          margin-bottom: 12px;
        }

        .brand-chip,
        .avatar {
          width: 34px;
          height: 34px;
          border-radius: 12px;
          font-size: 13px;
        }

        .projection-badge {
          padding: 7px 10px;
          font-size: 11px;
        }

        .chip-row,
        .tag-row,
        .segmented,
        .cta-row {
          gap: 8px;
        }

        .chip,
        .segment-button {
          padding: 8px 12px;
          font-size: 13px;
        }

        .panel,
        .card,
        .compare-card,
        .faq-item,
        .journey-card,
        .spotlight-card {
          padding: 15px;
          border-radius: 22px;
        }

        .grid,
        .journey-grid,
        .detail-grid,
        .capability-layout,
        .compare-grid {
          gap: 10px;
        }

        .section {
          margin-top: 14px;
        }

        th,
        td {
          padding: 10px 8px;
          font-size: 12px;
        }

        .faq-item h3 {
          margin-bottom: 6px;
          font-size: 16px;
          line-height: 1.28;
        }

        .tabbar-wrap {
          padding: 8px 10px calc(env(safe-area-inset-bottom, 0) + 8px);
        }

        .tabbar {
          padding: 8px;
          gap: 6px;
        }

        .tab-button {
          padding: 8px 4px 10px;
        }

        .tab-button .icon {
          width: 28px;
          height: 28px;
          border-radius: 10px;
          font-size: 13px;
        }
      }

      @media (min-width: 768px) {
        .app-shell {
          padding: 24px 24px 0;
        }

        .hero {
          padding: 26px;
        }

        .grid.capability-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .detail-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .journey-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .capability-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (min-width: 900px) and (orientation: landscape) {
        .screen.overview .hero-grid {
          grid-template-columns: 1.25fr 0.95fr;
        }

        .screen.overview .projection-strip {
          grid-template-columns: 1.2fr 0.8fr 0.8fr;
        }

        .screen.overview .layout-split,
        .screen.compare .compare-grid,
        .screen.faq .faq-grid {
          grid-template-columns: 1.15fr 0.85fr;
        }

        .scenario-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .detail-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .journey-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (min-width: 900px) and (orientation: portrait) {
        .grid.capability-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .scenario-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const injectedContext = window.__TIDB_COMPASS_CONTEXT__ || {};
      const locale = params.get("lang") || injectedContext.lang || "zh-CN";
      const device = params.get("device") || injectedContext.device || "iphone";
      const orientation = params.get("orientation") || injectedContext.orientation || "portrait";

      const messages = {
        "zh-CN": {
          appName: "TiDB Compass",
          reviewer: "售前模式",
          heroKicker: "Overview",
          heroTitle: "把 TiDB 的价值讲成一款真正可演示的 iOS 应用",
          heroSubtitle:
            "先按客户诉求筛选，再进入能力、场景、对比和 Q&A。竖屏下优先保留能直接拿来讲的内容。",
          metrics: [
            ["快", "一套平台衔接事务处理与近实时分析"],

                      <div class="journey-card">
                        <strong>01</strong>
                        <h3>${uiLabels.need}</h3>
                        <p>${copy.chips.scaling}</p>
                      </div>
                      <div class="journey-card">
                        <strong>02</strong>
                        <h3>${uiLabels.proof}</h3>
                        <p>${copy.compare.rows[0][1]}</p>
                      </div>
                      <div class="journey-card">
                        <strong>03</strong>
                        <h3>${uiLabels.risk}</h3>
                        <p>${copy.compare.rows[3][2]}</p>
                      </div>
                    </div>
                  </article>
                </div>
                <article class="compare-card">
                  <h3>${copy.compare.summaryTitle}</h3>
                  <p>${copy.compare.summaryBody}</p>
                  <div class="summary-stack">
                    ${copy.compare.highlights
                      .map(
                        (item, index) => `
                          <div class="summary-tile two-line">
                            <strong class="${index < 2 ? "good" : "warning"}">${item[0]}</strong>
                            <span>${item[1]}</span>
                          </div>
                        `
                      )
                      .join("")}
                  </div>
                  <div class="stage-rail">
                    <article class="stage-tile">
                      <strong>${uiLabels.stageMode}</strong>
                      <span>${uiLabels.stageBody}</span>
                    </article>
                    <article class="stage-tile">
                      <strong>${uiLabels.stageReason}</strong>
                      <span>${uiLabels.stageReasonBody}</span>
                    </article>
                    <article class="stage-tile">
                      <strong>${uiLabels.stageNext}</strong>
                      <span>${uiLabels.stageNextBody}</span>
                    </article>
                  </div>
                </article>
              </div>
            </section>

            <section class="screen ${activeTab === "faq" ? "is-active" : ""}">
              <div class="section-header">
                <p class="kicker">${copy.tabs[4]}</p>
                <h2>${copy.faq.title}</h2>
                <p>${copy.faq.body}</p>
              </div>
              <div class="faq-grid">
                ${copy.faq.cards
                  .map(
                    (card) => `
                      <article class="faq-item">
                        <h3>${card[0]}</h3>
                        <p>${card[1]}</p>
                      </article>
                    `
                  )
                  .join("")}
              </div>
            </section>
          </div>

          <div class="tabbar-wrap">
            <div class="tabbar">
              ${tabs
                .map(
                  (tab, index) => `
                    <button class="tab-button ${activeTab === tab ? "is-active" : ""}" type="button" data-tab="${tab}">
                      <span class="icon">${tabGlyph(tab)}</span>
                      <strong>${copy.tabs[index]}</strong>
                    </button>
                  `
                )
                .join("")}
            </div>
          </div>
        `;

        root.querySelectorAll("[data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            activeTab = button.dataset.tab;
            renderApp();
          });
        });

        root.querySelectorAll("[data-need]").forEach((button) => {
          button.addEventListener("click", () => {
            activeNeed = button.dataset.need;
            renderApp();
          });
        });
      }

      renderApp();
    </script>
  </body>
</html>
